name: 更新台指夜盤決策頁

on:
  schedule:
    # GitHub cron 用 UTC；台灣時間 = UTC+8（排程可能延遲幾分鐘到十幾分鐘）
    - cron: "10 22 * * 0-4"   # 台灣 週一～五 06:10（夜盤 05:00 收）
    - cron: "30 23 * * 0-4"   # 台灣 週一～五 07:30
    - cron: "30 0 * * 1-5"    # 台灣 週一～五 08:30
    - cron: "30 7 * * 1-5"    # 台灣 週一～五 15:30（日盤收盤後，補上實際結果）
  workflow_dispatch: {}       # 手動按 Run workflow 也能更新

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 抓期交所資料、產生頁面
        run: |
          python taifex_night.py
          mkdir -p site
          cp index.html site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
